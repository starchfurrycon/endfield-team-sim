<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>终末地配队模拟</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --fg:#e6edf3; --dim:#8b949e; --acc:#4ea1ff; --warn:#ffb454;
    --cold:#4ea1ff; --hot:#ff7a59; --ok:#3fb950; --bad:#f85149;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 "Microsoft YaHei",system-ui,-apple-system,sans-serif;}
  header{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;
         gap:10px;align-items:center;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600}
  .chip{font-size:11px;color:var(--dim);border:1px solid var(--line);
        border-radius:999px;padding:1px 7px}
  main{display:grid;grid-template-columns:286px 1fr;height:calc(100vh - 46px)}
  #side{border-right:1px solid var(--line);overflow:auto;padding:10px;background:var(--panel)}
  #main{overflow:auto;padding:12px}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    padding:5px 8px;border-radius:6px;font-size:13px;min-width:0}
  input[type=text]{width:100%}
  input[type=number]{-moz-appearance:textfield;text-align:center;padding:4px 2px}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  button{background:var(--acc);color:#04121f;border:0;border-radius:6px;
         padding:6px 10px;font-weight:600;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .row .muted{white-space:nowrap;flex:0 0 auto}
  .elems{display:flex;gap:4px;margin-bottom:8px}
  .chip-btn{width:22px;height:22px;border-radius:50%;border:1px solid transparent;
            background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
  .chip-btn i{display:block;width:12px;height:12px;border-radius:50%}
  .chip-btn.on{border-color:var(--fg)}
  #ops{margin-top:4px}
  .op{display:flex;gap:8px;align-items:center;padding:3px 5px;border-radius:7px;
      cursor:pointer;border:1px solid transparent;min-height:36px}
  .op:hover{background:var(--panel2)}
  .op.must{background:rgba(63,185,80,.14);border-color:rgba(63,185,80,.55)}
  .op.ban{background:rgba(248,81,73,.10);border-color:rgba(248,81,73,.5);opacity:.55}
  .op .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .op .st{font-size:10px;color:var(--dim)}
  /* 头像 */
  .av{position:relative;display:inline-grid;place-items:center;border-radius:50%;
      overflow:hidden;background:var(--panel2);flex:0 0 auto}
  .av i{font-style:normal;font-size:12px;color:#c9d1d9;font-weight:600}
  .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .av.r6{box-shadow:inset 0 0 0 2px #ffb454}
  .av.r5{box-shadow:inset 0 0 0 2px #a371f7}
  .av.r4{box-shadow:inset 0 0 0 2px #4ea1ff}
  /* 卡 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:10px 12px;margin-bottom:10px}
  .card-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .card-h .team{display:flex;gap:4px;align-items:center}
  .card-h .tscore{margin-left:auto;font-size:11px;color:var(--dim)}
  .tabs{display:flex;gap:4px;margin-left:4px}
  .tabs button{padding:3px 7px;font-size:11px;background:transparent;color:var(--fg);
               border:1px solid var(--line)}
  .tabs button.on{background:var(--acc);color:#04121f;border-color:var(--acc)}
  .kpi{display:flex;gap:16px;align-items:baseline;margin:2px 0 8px;flex-wrap:wrap}
  .kpi .k{font-size:10px;color:var(--dim)}
  .kpi b{font-size:19px;font-weight:600}
  .kpi .cold b{color:var(--cold)} .kpi .hot b{color:var(--hot)}
  .kpi .cold,.kpi .hot{display:flex;gap:5px;align-items:baseline}
  .kpi .dim2{font-size:11px;color:var(--dim)}
  .lane{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin:2px 0}
  .lane .lb{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--dim);
            white-space:nowrap;overflow:hidden}
  .lane .lb span{overflow:hidden;text-overflow:ellipsis}
  .track{position:relative;height:20px;background:var(--panel2);border-radius:4px;
         border:1px solid var(--line);overflow:hidden}
  .bar{position:absolute;top:2px;height:15px;border-radius:3px;background:var(--acc);opacity:.85}
  .bar.combo{background:#a371f7} .bar.ultimate{background:#ff7a59}
  .bar.power_attack{background:#e3b341} .bar.battle_skill{background:#4ea1ff}
  .bar.enemy{background:#f85149;opacity:.4}
  .hit{position:absolute;top:0;width:2px;height:20px;background:#fff;opacity:.7}
  .ticks{display:grid;grid-template-columns:96px 1fr;gap:6px;color:var(--dim);font-size:10px}
  .ticks .t{position:relative;height:12px;border-top:1px solid var(--line)}
  .ticks .t span{position:absolute;transform:translateX(-50%);top:1px}
  .wl{position:relative;margin:8px 0 2px}
  .wl-row{display:grid;grid-template-columns:96px 1fr 34px;gap:6px;align-items:center;margin:2px 0}
  .wl-row .lb{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--dim)}
  .wl-row .track{height:16px}
  .wl-row .cap{font-size:10px;color:var(--dim);text-align:right}
  .wl svg{position:absolute;inset:0;width:100%;height:100%}
  .wl-cursor{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:.45;
             display:none;pointer-events:none}
  .wl-tip{position:absolute;top:-2px;transform:translate(-50%,-100%);background:#0b0f14;
          border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11px;
          white-space:nowrap;display:none;pointer-events:none;z-index:5}
  .contrib{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--panel2)}
  .contrib div{height:100%}
  .meta-line{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11px;color:var(--dim)}
  .meta-line button{background:transparent;border:1px solid var(--line);color:var(--dim);
                    padding:1px 7px;font-size:11px;font-weight:400}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--dim);font-size:11px;list-style:none}
  summary::-webkit-details-marker{display:none}
  table{border-collapse:collapse;width:100%;font-size:11px;margin-top:6px}
  th,td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:left}
  th{color:var(--dim);font-weight:500}
  .muted{color:var(--dim);font-size:11px}
  .warn{color:var(--warn);font-size:12px}
  /* 首启 */
  #boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;
        align-items:center;justify-content:center;padding:24px}
  #boot.open{display:flex}
  .boot-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);
             border-radius:12px;padding:20px}
  .boot-card h2{font-size:15px;margin:0 0 8px}
  .bar-outer{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;
             border:1px solid var(--line);margin:12px 0 6px}
  .bar-inner{height:100%;width:0;background:linear-gradient(90deg,#4ea1ff,#3fb950);
             transition:width .3s ease}
  .boot-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  .boot-err{color:var(--bad);font-size:11px;white-space:pre-wrap;margin-top:6px}
  /* 对比 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;
         align-items:flex-start;justify-content:center;padding:20px;z-index:50;overflow:auto}
  .modal.open{display:flex}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
              width:min(1180px,100%);padding:12px;position:relative}
  .modal-card h2{font-size:14px;margin:0 0 4px}
  .modal-card .close{position:absolute;right:8px;top:6px;background:transparent;
                     border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:2px 8px}
  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
  .cmp-side{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2)}
  .cmp-side h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:500}
  .cmp-side .field{display:grid;grid-template-columns:38px 1fr;gap:6px;align-items:center;
                   margin-bottom:5px}
  .cmp-side select{width:100%;padding:3px 6px;font-size:12px}
  .cmp-out .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cmp-col{border:1px solid var(--line);border-radius:8px;padding:8px}
  .cmp-sum{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0;
           padding:8px 10px;background:var(--panel2);border-radius:8px;font-size:12px}
  .cmp-sum b{font-size:19px}
  .up{color:var(--ok)} .down{color:var(--bad)}
  /* LLM 设置 */
  #llm-btn{display:flex;gap:6px;align-items:center;padding:3px 9px;font-size:11px;
           font-weight:500;background:transparent;border:1px solid var(--line);
           color:var(--dim)}
  #llm-btn.on{color:var(--fg);border-color:rgba(94,231,242,.5)}
  #llm-btn .dot2{width:7px;height:7px;border-radius:50%;background:#5d6b76}
  #llm-btn.on .dot2{background:#5ee7f2;box-shadow:0 0 6px #5ee7f2}
  .llm-grid{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;
            margin:8px 0}
  .llm-grid input[type=text],.llm-grid input[type=password]{width:100%}
  .llm-note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px}
  .llm-run{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px}
  .llm-run .row{margin-bottom:6px}
  .pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;
        border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:rgba(63,185,80,.45)}
  .pill.bad{color:var(--bad);border-color:rgba(248,81,73,.45)}
  .pill.run{color:var(--warn);border-color:rgba(255,180,84,.45)}
  .llm-table{width:100%;font-size:11px}
  .llm-table td{padding:2px 4px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <h1>终末地配队模拟</h1>
  <span class="chip" id="ver">…</span>
  <span class="chip" id="build-pill" hidden></span>
  <span style="flex:1"></span>
  <button id="llm-btn" title="LLM 自更新设置"><span class="dot2"></span>LLM</button>
</header>

<main>
  <aside id="side">
    <div class="row"><input id="q" type="text" placeholder="搜索" /></div>
    <div class="elems" id="elems"></div>
    <div class="row">
      <span class="muted">窗口</span>
      <input id="dur" type="number" value="40" style="width:38px" title="窗口（秒）"/>
      <select id="eprofile" title="敌人出手节奏" style="padding:4px 4px">
        <option value="normal">敌 8s</option>
        <option value="slow">敌 12s</option>
        <option value="fast">敌 5s</option>
        <option value="burst">敌 4s</option>
      </select>
      <span class="muted">Top</span>
      <input id="top" type="number" value="3" style="width:30px" title="Top N"/>
    </div>
    <div class="row">
      <button id="go" style="flex:1">推荐</button>
      <button id="clr" class="ghost" title="清空" style="padding:5px 9px">✕</button>
    </div>
    <div id="ops"></div>
  </aside>

  <section id="main">
    <div id="result" class="muted">选人 → 推荐</div>
  </section>
</main>

<div id="boot">
  <div class="boot-card">
    <h2 id="boot-title">准备数据…</h2>
    <div class="bar-outer"><div class="bar-inner" id="boot-bar"></div></div>
    <div class="boot-meta"><span id="boot-msg"></span><span id="boot-pct">0%</span></div>
    <div class="boot-err" id="boot-err" hidden></div>
    <div class="row" style="margin-top:10px">
      <button id="boot-retry" hidden>重试</button>
    </div>
  </div>
</div>

<div id="cmp" class="modal">
  <div class="modal-card">
    <button class="close" id="cmp-close">×</button>
    <h2>对比</h2>
    <div class="cmp-grid" id="cmp-config"></div>
    <div class="row"><button id="cmp-run">开始</button><span class="muted" id="cmp-status"></span></div>
    <div class="cmp-out" id="cmp-out"></div>
  </div>
</div>

<!-- LLM 设置 / 自更新 -->
<div id="llm" class="modal">
  <div class="modal-card" style="width:min(720px,100%)">
    <button class="close" id="llm-close">×</button>
    <h2>LLM 自更新</h2>
    <div class="muted" id="llm-state">…</div>

    <div class="llm-grid">
      <span class="muted">启用</span>
      <label style="display:flex;gap:8px;align-items:center;font-size:12px">
        <input type="checkbox" id="llm-enabled" />
        <span class="muted">勾选后，重建数据时自动用 LLM 复核语义</span>
      </label>
      <span class="muted">接口</span>
      <input type="text" id="llm-base" placeholder="https://api.deepseek.com/v1" />
      <span class="muted">模型</span>
      <input type="text" id="llm-model" placeholder="deepseek-chat" />
      <span class="muted">API Key</span>
      <input type="password" id="llm-key" placeholder="留空 = 不修改已保存的密钥" autocomplete="off" />
    </div>
    <div class="row">
      <button id="llm-save">保存</button>
      <button id="llm-test" class="ghost">测试连接</button>
      <span class="muted" id="llm-msg"></span>
    </div>
    <div class="llm-note">
      只把技能描述文本发给你配置的接口；密钥保存在本机 <code id="llm-path">data/llm.json</code>，
      不会写进仓库，也不会回传给页面（只显示掩码）。未配置时全部走规则通道。
    </div>

    <div class="llm-run">
      <div class="row">
        <span class="muted">复核范围</span>
        <select id="llm-mode">
          <option value="gaps">仅不确定（省 token）</option>
          <option value="all">全部技能</option>
        </select>
        <span class="muted">上限</span>
        <input id="llm-limit" type="number" placeholder="全部" style="width:62px" />
        <button id="llm-run-btn">运行复核</button>
        <span class="pill" id="llm-run-pill">空闲</span>
      </div>
      <div class="muted" id="llm-run-msg"></div>
      <div id="llm-run-out"></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const ELEM_COLOR = {物理:'#8b949e',灼热:'#fe623c',电磁:'#ffbe02',寒冷:'#21c5ce',自然:'#9edc23',超域:'#a371f7'};
const OP_COLORS = ['#4ea1ff','#ff7a59','#3fb950','#a371f7','#e3b341'];
const ENEMY_LABEL = {slow:'敌 12s', normal:'敌 8s', fast:'敌 5s', burst:'敌 4s'};
const RARITY_CLASS = {6:'r6',5:'r5',4:'r4'};
let META = null, STATE = {}, MODE = 'cold', LOADOUT = {}, ELEM = '';

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt; return e; }
function fmt(n){ return Math.round(n).toLocaleString(); }
function jget(url){ return fetch(url).then(async r => {
  const d = await r.json().catch(()=>({error:'bad json'}));
  if(!r.ok && d.error) throw new Error(d.error); return d; }); }
function jpost(url, body){ return fetch(url, {method:'POST',
  headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})})
  .then(async r => { const d = await r.json().catch(()=>({error:'bad json'}));
    if(!r.ok && d.error) throw new Error(d.error); return d; }); }

/* 头像：优先真实图，失败退化成"元素色块 + 首字" */
function avatar(opOrId, size, name){
  const op = (typeof opOrId === 'string')
    ? (META && META.operators.find(o => o.id === opOrId)) : opOrId;
  const id = op ? op.id : opOrId;
  const nm = name || (op && op.name) || '';
  const color = (op && ELEM_COLOR[op.element]) || '#39414f';
  const wrap = el('span', 'av ' + (RARITY_CLASS[(op||{}).rarity] || ''));
  wrap.style.width = wrap.style.height = size + 'px';
  wrap.style.background = 'radial-gradient(circle at 50% 35%, ' + color + '55, #161b22)';
  const i = el('i', null, nm.slice(0,1));
  i.style.fontSize = Math.max(10, Math.round(size*0.42)) + 'px';
  wrap.appendChild(i);
  if(id){
    const img = document.createElement('img');
    img.src = '/avatars/' + id + '.png';
    img.alt = nm;
    img.onerror = () => img.remove();
    wrap.appendChild(img);
  }
  wrap.title = nm + (op && op.profession ? ' · ' + op.profession : '')
    + (op && op.element ? ' · ' + op.element : '')
    + (op && op.note ? '\n' + op.note : '');
  return wrap;
}

/* ------------------------------------------------------------ 启动 */

async function waitForData(){
  const st = await jget('/api/status');
  if(st.state === 'ready'){ hideBoot(); return true; }
  showBoot(st);
  if(st.state === 'idle'){
    $('#boot-retry').hidden = false; $('#boot-retry').textContent = '开始';
  }
  return new Promise((resolve) => {
    const timer = setInterval(async () => {
      try{
        const s2 = await jget('/api/status'); updateBoot(s2);
        if(s2.state === 'ready'){ clearInterval(timer); hideBoot(); resolve(true); }
      }catch(e){}
    }, 700);
  });
}
function showBoot(st){ $('#boot').classList.add('open'); updateBoot(st); }
function hideBoot(){ $('#boot').classList.remove('open'); $('#build-pill').hidden = true; }
function updateBoot(st){
  const pct = Math.max(0, Math.min(100, st.percent || 0));
  $('#boot-bar').style.width = pct + '%';
  $('#boot-pct').textContent = pct + '%';
  $('#boot-msg').textContent = st.message || '';
  $('#boot-title').textContent = st.state === 'error' ? '构建失败' : '准备数据…';
  $('#boot-err').hidden = st.state !== 'error';
  $('#boot-retry').hidden = st.state !== 'error';
  if(st.state === 'error') $('#boot-err').textContent = st.error || '';
  $('#build-pill').hidden = false;
  $('#build-pill').textContent = st.state === 'error' ? '构建失败' : ('构建 ' + pct + '%');
}
$('#boot-retry').onclick = async () => {
  $('#boot-retry').disabled = true;
  try{ await jpost('/api/status', {action:'rebuild'}); }
  catch(e){ $('#boot-err').hidden = false; $('#boot-err').textContent = e.message; }
  finally{ $('#boot-retry').disabled = false; }
};

/* ------------------------------------------------------------ 选人 */

async function loadMeta(){
  META = await jget('/api/meta');
  $('#ver').textContent = 'v' + (META.app_version || '');
  $('#ver').title = '数据集 ' + (META.version || '') + ' · ' + META.count + ' 名可用干员';
  META.operators.forEach(o => { if(!(o.id in STATE)) STATE[o.id] = 0; });
  renderElems();
  renderOps();
}

function renderElems(){
  const box = $('#elems'); box.innerHTML = '';
  const all = el('button','chip-btn' + (ELEM===''?' on':''), '');
  all.title = '全部';
  all.innerHTML = '<i style="background:#5b6472"></i>';
  all.onclick = () => { ELEM = ''; renderElems(); renderOps(); };
  box.appendChild(all);
  Object.entries(ELEM_COLOR).forEach(([name, color]) => {
    const b = el('button','chip-btn' + (ELEM===name?' on':''));
    const d = el('i'); d.style.background = color; b.appendChild(d);
    b.title = name;
    b.onclick = () => { ELEM = (ELEM===name ? '' : name); renderElems(); renderOps(); };
    box.appendChild(b);
  });
}

function renderOps(){
  if(!META) return;
  const q = ($('#q').value||'').trim().toLowerCase();
  const box = $('#ops'); box.innerHTML = '';
  META.operators
    .filter(o => (!q || o.name.toLowerCase().includes(q) ||
                  (o.tags||[]).some(t => t.toLowerCase().includes(q)))
              && (!ELEM || o.element === ELEM))
    .forEach(o => {
      const row = el('div','op' + (STATE[o.id]===1?' must':STATE[o.id]===2?' ban':''));
      row.appendChild(avatar(o, 30));
      row.appendChild(el('span','nm', o.name));
      row.onclick = () => { STATE[o.id] = (STATE[o.id]+1)%3; renderOps(); };
      row.title = `${o.name} · ${o.profession || ''} · ${o.element || ''}`
        + (o.note ? '\n' + o.note : '');
      box.appendChild(row);
    });
}

function picked(kind){ return Object.keys(STATE).filter(k => STATE[k]===kind); }

async function runTeam(){
  const btn = $('#go'); btn.disabled = true; btn.textContent = '…';
  try{
    const data = await jpost('/api/team', {must: picked(1), ban: picked(2),
      duration: +$('#dur').value, top: +$('#top').value, evaluate: 8});

/* ------------------------------------------------------------ 甘特 + 水位 */

function gantt(res, order, nameMap){
  const dur = Math.max(1, res.duration_frames)/30;
  const box = el('div');
  const lane = (labelNode, events) => {
    const l = el('div','lane');
    const lb = el('div','lb');
    if(labelNode) lb.appendChild(labelNode);
    l.appendChild(lb);
    const tr = el('div','track');
    events.forEach(ev => {
      const s = ev.frame/30, e = Math.max(ev.commit_end||ev.frame, ev.frame+1)/30;
      const b = el('div','bar ' + (ev.bar||''));
      b.style.left = (s/dur*100)+'%';
      b.style.width = Math.max(0.5,(e-s)/dur*100)+'%';
      b.title = `${ev.label} ${s.toFixed(2)}s`;
      tr.appendChild(b);
      (ev.hits||[]).forEach(hf => {
        const hit = el('div','hit'); hit.style.left = ((hf/30)/dur*100)+'%';
        tr.appendChild(hit);
      });
    });
    l.appendChild(tr);
    return l;
  };
  order.forEach(cid => {
    const op = META.operators.find(o => o.id === cid);
    const lb = document.createElement('span');
    lb.appendChild(avatar(op || cid, 18, nameMap[cid]));
    lb.appendChild(document.createTextNode(nameMap[cid] || cid));
    const evs = (res.timeline||[]).filter(e => e.kind==='cast' && e.op===cid)
      .map(e => ({...e, bar: e.slot}));
    box.appendChild(lane(lb, evs));
  });
  const enemy = (res.timeline||[]).filter(e => e.kind==='enemy_attack')
    .map(e => ({frame:e.frame, commit_end:e.frame, label:e.label, bar:'enemy'}));
  if(enemy.length) box.appendChild(lane(el('span',null,''), enemy));

  const ticks = el('div','ticks');
  ticks.appendChild(el('div'));
  const tk = el('div','t');
  const step = dur > 60 ? 10 : 5;
  for(let s=0;s<=dur;s+=step){
    const sp = el('span',null,s+'s');
    sp.style.left = (s/dur*100)+'%';
    tk.appendChild(sp);
  }
  ticks.appendChild(tk);
  return {box, ticks};
}

function waterlines(res, order, nameMap){
  const st = res.stats || {};
  const samples = (st.samples || []).slice().sort((a,b)=>a.f-b.f);
  const durF = Math.max(1, res.duration_frames);
  const spMax = st.sp_max || 300;
  const caps = st.energy_cap || {};
  const wrap = el('div','wl');
  const rows = [];

  const row = (labelNode, color, max, getter, energyId) => {
    const r = el('div','wl-row');
    const lb = el('div','lb');
    if(labelNode) lb.appendChild(labelNode);
    r.appendChild(lb);
    const tr = el('div','track');
    r.appendChild(tr);
    r.appendChild(el('span','cap', String(Math.round(max))));
    if(samples.length){
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS,'svg');
      svg.setAttribute('viewBox','0 0 1000 40');
      svg.setAttribute('preserveAspectRatio','none');
      const pts = samples.map(s => {
        const x = (s.f/durF)*1000;
        const v = Math.max(0, Math.min(max, getter(s)));
        const y = 38 - (v/(max||1))*34;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      if(energyId === null){
        const area = document.createElementNS(NS,'polygon');
        area.setAttribute('points', `0,40 ${pts} 1000,40`);
        area.setAttribute('fill', color); area.setAttribute('opacity','0.14');
        svg.appendChild(area);
      }
      const line = document.createElementNS(NS,'polyline');
      line.setAttribute('points', pts);
      line.setAttribute('fill','none');
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width','1.5');
      line.setAttribute('vector-effect','non-scaling-stroke');
      line.setAttribute('stroke-linejoin','round');
      svg.appendChild(line);
      tr.appendChild(svg);
    }
    rows.push({labelNode, max, getter, energyId, color});
    return r;
  };

  const spLabel = el('span', null, 'SP');
  wrap.appendChild(row(spLabel, '#4ea1ff', spMax, s=>s.sp, null));
  order.forEach((cid, i) => {
    const op = META.operators.find(o => o.id === cid);
    wrap.appendChild(row(avatar(op || cid, 16, nameMap[cid]),
      OP_COLORS[i % OP_COLORS.length], caps[cid] || 100,
      s=>((s.e||{})[cid]||0), cid));
  });

  if(samples.length){
    const cur = el('div','wl-cursor'), tip = el('div','wl-tip');
    wrap.appendChild(cur); wrap.appendChild(tip);
    wrap.onmousemove = (ev) => {
      const trackEl = wrap.querySelector('.track');
      if(!trackEl) return;
      const r = trackEl.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (ev.clientX - r.left)/Math.max(1,r.width)));
      const f = ratio * durF;
      let lo = 0, hi = samples.length - 1;
      while(lo < hi){ const mid = (lo+hi)>>1; if(samples[mid].f < f) lo = mid+1; else hi = mid; }
      if(lo > 0 && Math.abs(samples[lo-1].f - f) < Math.abs(samples[lo].f - f)) lo -= 1;
      const s = samples[lo];
      const x = r.left - wrap.getBoundingClientRect().left + ratio*r.width;
      cur.style.display = 'block'; tip.style.display = 'block';
      cur.style.left = x + 'px'; tip.style.left = x + 'px';
      const parts = [`<b>${(s.f/30).toFixed(1)}s</b>`, `SP ${Math.round(s.sp)}`];
      rows.filter(x2=>x2.energyId).forEach(x2 => {
        const nm = (nameMap[x2.energyId] || x2.energyId);
        parts.push(`${nm} ${Math.round(x2.getter(s))}/${Math.round(x2.max)}`);
      });
      tip.innerHTML = parts.join(' · ');
    };
    wrap.onmouseleave = () => { cur.style.display='none'; tip.style.display='none'; };
  }
  return wrap;
}

function renderAxis(res, t, cfg){
  const wrap = el('div');
  const order = t.team, nameMap = t.name_map || {};
  const g = gantt(res, order, nameMap);
  wrap.appendChild(g.box);
  wrap.appendChild(g.ticks);
  wrap.appendChild(waterlines(res, order, nameMap));

  // 贡献条（颜色 = 角色，宽度 = 占比；不写字）
  const bar = el('div','contrib');
  const total = Math.max(1, res.total_damage);
  Object.entries(res.per_operator || {}).sort((a,b)=>b[1]-a[1]).forEach(([cid, d]) => {
    const idx = order.indexOf(cid);
    const seg = el('div');
    seg.style.width = (d/total*100) + '%';
    seg.style.background = OP_COLORS[(idx<0?0:idx) % OP_COLORS.length];
    seg.title = `${nameMap[cid] || cid} ${(d/total*100).toFixed(0)}%`;
    bar.appendChild(seg);
  });
  wrap.appendChild(bar);

  const meta = el('div','meta-line');
  const det = el('details');
  const sum = el('summary', null, 'ⓘ');
  sum.title = '细节：动作表 / 警告 / 未建模项';
  det.appendChild(sum);
  if(res.legality_issues && res.legality_issues.length){
    det.appendChild(el('div','warn', res.legality_issues.slice(0,3).join('; ')));
  }
  const fields = (res.stats && res.stats.cast_counts) || {};
  const slots = ['normal_attack','power_attack','battle_skill','combo_skill','ultimate'];
  det.appendChild(el('div','muted', '施放 ' + slots.reduce((a,k)=>a+(fields[k]||0),0)
    + ' 次 · 自动普攻 ' + (fields.auto_attack||0) + ' 次'));
  const rx = (res.stats && res.stats.reactions) || {};
  if(rx.totals && Object.keys(rx.totals).length){
    det.appendChild(el('div','muted', '异常 ' + Object.entries(rx.totals)
      .sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+fmt(v)).join(' · ')));
  }
  const tb = el('table');
  tb.innerHTML = '<tr><th>时间</th><th>结束</th><th>动作</th><th>命中</th></tr>';
  (res.timeline||[]).filter(e=>e.kind==='cast')
    .sort((a,b)=>a.frame-b.frame).forEach(e => {
      const tr = el('tr');
      tr.innerHTML = `<td>${(e.frame/30).toFixed(2)}</td>`+
        `<td>${((e.commit_end||e.frame)/30).toFixed(2)}</td>`+
        `<td>${e.label||e.kind}</td>`+
        `<td>${(e.hits||[]).map(h=>(h/30).toFixed(2)).join(', ')}</td>`;
      tb.appendChild(tr);
    });
  det.appendChild(tb);
  if(res.warnings && res.warnings.length){
    det.appendChild(el('div','muted', res.warnings.join('；')));
  }
  if(res.unmodeled && res.unmodeled.length){
    det.appendChild(el('div','muted', '未建模：' + res.unmodeled.join('；')));
  }
  meta.appendChild(det);
  wrap.appendChild(meta);
  return wrap;
}

async function ensureLoadout(team){
  const key = team.join(',');
  if(LOADOUT[key]) return LOADOUT[key];
  const data = await jpost('/api/loadout', {team});
  LOADOUT[key] = data.recommendations || {};
  return LOADOUT[key];
}

async function loadLoadout(t, card){
  let box = card.querySelector('.loadout-box');
  if(!box){ box = el('div','loadout-box'); card.appendChild(box); }
  box.innerHTML = ''; box.appendChild(el('div','muted','…'));
  try{
    const rec = await ensureLoadout(t.team);
    box.innerHTML = '';
    for(const row of Object.values(rec)){
      const blk = el('div'); blk.style.margin = '6px 0';
      const head = el('div','row');
      const op = META.operators.find(o => o.name === row.name);
      head.appendChild(avatar(op || row.name, 22, row.name));
      head.appendChild(el('span','muted', row.name));
      blk.appendChild(head);
      const tb = el('table');
      tb.innerHTML = '<tr><th>武器</th><th>ATK</th><th>ATK%</th><th>主属</th><th>等效</th></tr>';
      (row.weapons||[]).forEach(w => {
        const tr = el('tr');
        tr.innerHTML = `<td>${w.name || w.weapon_id}</td><td>${w.atk}</td>`+
          `<td>${(w.atk_pct*100).toFixed(0)}%</td><td>+${w.mainattr}</td><td>${fmt(w.score)}</td>`;
        tb.appendChild(tr);
      });
      blk.appendChild(tb);
      (row.equipment||[]).forEach(s => {
        const pieces = (s.piece_names && s.piece_names.length) ? s.piece_names : s.pieces;
        const line = el('div','muted', s.label + '：' + pieces.join('、'));
        line.title = (s.pieces||[]).join('\n');
        blk.appendChild(line);
      });
      box.appendChild(blk);
    }
  }catch(e){
    box.innerHTML = ''; box.appendChild(el('div','warn', e.message));
  }
}

let CMP_TEAM = null;

function sideConfig(side){
  const wrap = el('div','cmp-side');
  wrap.appendChild(el('h4', null, side.toUpperCase()));
  const field = (label, node) => {
    const f = el('div','field');
    f.appendChild(el('span','muted', label));
    f.appendChild(node);
    wrap.appendChild(f);
    return node;
  };
  const mk = (pairs) => {
    const s = document.createElement('select');
    pairs.forEach(([v,l]) => { const o = document.createElement('option');
      o.value = v; o.textContent = l; s.appendChild(o); });
    return s;
  };
  const mode = field('启动', mk([['cold','冷'],['hot','热']]));
  const enemy = field('敌人', mk(Object.entries(ENEMY_LABEL)));
  const equip = field('装备', mk((META.equip_presets||[]).map(p=>[p.id,p.label])));
  const lv = field('精锻', mk([[0,'0'],[1,'1'],[2,'2'],[3,'3']]));
  lv.value = '3';
  const rec = LOADOUT[(CMP_TEAM||[]).join(',')] || {};
  const first = Object.values(rec)[0] || {};
  const wopts = [['0','默认']].concat((first.weapons||[]).map((w,i)=>
    [String(i+1), '推荐' + (i+1) + ' ' + (w.name || w.weapon_id)]));
  const weapon = field('武器', mk(wopts));
  wrap._ctrl = {mode, enemy, equip, equip_level: lv, weapon};
  return wrap;
}

async function openCompare(t){
  CMP_TEAM = t.team;
  const box = $('#cmp-config'); box.innerHTML = '';
  try{ await ensureLoadout(t.team); }catch(e){}
  const a = sideConfig('a'), b = sideConfig('b');
  a._ctrl.mode.value = 'cold'; a._ctrl.enemy.value = 'normal';
  b._ctrl.mode.value = 'cold'; b._ctrl.enemy.value = 'normal';
  b._ctrl.equip.value = 'output';
  box.appendChild(a); box.appendChild(b);
  $('#cmp-out').innerHTML = '';
  $('#cmp-status').textContent = '';
  $('#cmp').classList.add('open');
  $('#cmp')._sides = [a, b];
  $('#cmp')._team = t;
  $('#cmp-run').onclick = () => runCompare(t);
}
function sideSpec(sideEl){
  const c = sideEl._ctrl;
  return {mode:c.mode.value, enemy:c.enemy.value, equip:c.equip.value,
          equip_level:+c.equip_level.value, weapon:+c.weapon.value};
}
async function runCompare(t){
  const sides = $('#cmp')._sides || [];
  $('#cmp-run').disabled = true; $('#cmp-status').textContent = '…';
  try{
    const data = await jpost('/api/compare', {team:t.team, duration:+$('#dur').value,
      a:sideSpec(sides[0]), b:sideSpec(sides[1])});
    renderCompare(data, t);
    $('#cmp-status').textContent = '';
  }catch(e){ $('#cmp-status').textContent = e.message; }
  finally{ $('#cmp-run').disabled = false; }
}
function renderCompare(data, t){
  const out = $('#cmp-out'); out.innerHTML = '';
  const A = data.sides.a, B = data.sides.b, d = data.delta || {};
  const sum = el('div','cmp-sum');
  const cls = (d.total_damage >= 0) ? 'up' : 'down';
  const big = el('div', cls);
  big.appendChild(el('b', null, (d.total_damage>=0?'+':'') + fmt(d.total_damage)));
  sum.appendChild(big);
  sum.appendChild(el('span', cls, (d.damage_pct>=0?'+':'') + (d.damage_pct||0).toFixed(1) + '%'));
  sum.appendChild(el('span','muted', fmt(A.rotation.result.total_damage) + ' → '
    + fmt(B.rotation.result.total_damage)));
  out.appendChild(sum);

  const cols = el('div','cols');
  [A, B].forEach(side => {
    const col = el('div','cmp-col');
    const h = el('div','row');
    const team = el('div','team');
    t.team.forEach(cid => {
      const op = META.operators.find(o => o.id === cid);
      team.appendChild(avatar(op || cid, 22, (data.name_map||{})[cid]));
    });
    h.appendChild(team);
    h.appendChild(el('span','muted', side.side + ' '
      + (side.config.mode === 'hot' ? '热' : '冷')));
    col.appendChild(h);
    const res = side.rotation.result;
    const kpi = el('div','kpi');
    kpi.appendChild(kpiEl(side.config.mode === 'hot' ? 'hot' : 'cold', 'DPS', res.dps));
    col.appendChild(kpi);
    const g = gantt(res, t.team, data.name_map || t.name_map);
    col.appendChild(g.box); col.appendChild(g.ticks);
    col.appendChild(waterlines(res, t.team, data.name_map || t.name_map));
    cols.appendChild(col);
  });
  out.appendChild(cols);
}

/* ------------------------------------------------------------ LLM 自更新 */

let LLM = null, LLM_POLL = null, LLM_OPEN = false;

function llmChip(){
  const b = $('#llm-btn');
  if(!b) return;
  const on = !!(LLM && LLM.available);
  b.classList.toggle('on', on);
  b.title = on
    ? `LLM 已启用 · ${LLM.model} · prompt ${LLM.prompt_version}`
    : 'LLM 未配置（规则模式）';
}

async function loadLLM(){
  try{ LLM = await jget('/api/llm'); }catch(e){ /* 旧后端没有该接口 */ }
  llmChip();
  if(LLM_OPEN) fillLLM();
}

function fillLLM(){
  if(!LLM) return;
  $('#llm-state').textContent =
    (LLM.available ? `已启用 · ${LLM.model}` : '未配置（规则模式）')
    + ` · prompt ${LLM.prompt_version} · 缓存 ${LLM.cache_files} 条`;
  $('#llm-enabled').checked = !!LLM.enabled;
  $('#llm-base').value = LLM.base || '';
  $('#llm-model').value = LLM.model || '';
  $('#llm-key').value = '';
  $('#llm-key').placeholder = LLM.has_key
    ? `已保存（${LLM.key_masked}），留空不修改` : '粘贴 API key';
  $('#llm-path').textContent = LLM.config_path || 'data/llm.json';
  renderLLMRun(LLM.run || {});
}

$('#llm-btn').onclick = async () => {
  LLM_OPEN = true;
  $('#llm').classList.add('open');
  await loadLLM();
  fillLLM();
};
$('#llm-close').onclick = () => { LLM_OPEN = false; $('#llm').classList.remove('open'); };
$('#llm').onclick = (e) => {
  if(e.target.id === 'llm'){ LLM_OPEN = false; $('#llm').classList.remove('open'); }
};

$('#llm-save').onclick = async () => {
  const patch = {
    enabled: $('#llm-enabled').checked,
    base: $('#llm-base').value.trim(),
    model: $('#llm-model').value.trim(),
  };
  const key = $('#llm-key').value.trim();
  if(key) patch.key = key;
  try{
    LLM = await jpost('/api/llm', patch);
    $('#llm-msg').textContent = '已保存';
    fillLLM(); llmChip();
  }catch(e){ $('#llm-msg').textContent = e.message; }
};

$('#llm-test').onclick = async () => {
  $('#llm-msg').textContent = '测试中…';
  try{
    const r = await jpost('/api/llm/test');
    $('#llm-msg').textContent = r.ok
      ? `连接成功 · ${r.model} · ${r.latency_ms}ms`
      : `失败：${r.error}`;
  }catch(e){ $('#llm-msg').textContent = e.message; }
};

$('#llm-run-btn').onclick = async () => {
  const mode = $('#llm-mode').value;
  const limit = $('#llm-limit').value;
  try{
    await jpost('/api/llm/run', {mode, limit: limit ? +limit : undefined});
    $('#llm-run-pill').className = 'pill run';
    $('#llm-run-pill').textContent = '运行中';
    startLLMPoll();
  }catch(e){
    $('#llm-run-pill').className = 'pill bad';
    $('#llm-run-pill').textContent = '失败';
    $('#llm-run-msg').textContent = e.message;
  }
};

function startLLMPoll(){
  if(LLM_POLL) return;
  LLM_POLL = setInterval(async () => {
    try{
      LLM = await jget('/api/llm');
      llmChip();
      renderLLMRun(LLM.run || {});
      if(LLM.run && LLM.run.state !== 'running'){
        clearInterval(LLM_POLL); LLM_POLL = null;
        if(LLM.run.state === 'done') await loadMeta();
      }
    }catch(e){}
  }, 900);
}

function renderLLMRun(run){
  const pill = $('#llm-run-pill'), msg = $('#llm-run-msg'), out = $('#llm-run-out');
  if(run.state === 'running'){
    pill.className = 'pill run'; pill.textContent = '运行中';
    msg.textContent = run.message || '';
  }else if(run.state === 'done'){
    pill.className = 'pill ok'; pill.textContent = '完成'; msg.textContent = '';
  }else if(run.state === 'error'){
    pill.className = 'pill bad'; pill.textContent = '失败';
    msg.textContent = run.error || '';
  }else{
    pill.className = 'pill'; pill.textContent = '空闲'; msg.textContent = '';
  }
  if(run.state === 'done' && run.stats){
    const s = run.stats;
    out.innerHTML = '';
    const tb = el('table', 'llm-table');
    tb.innerHTML =
      `<tr><td>采纳 / 拒绝</td><td>${s.llm_used} / ${s.llm_rejected}`
      + `（缓存 ${s.llm_cache}，修复 ${s.repaired}）</td></tr>`
      + `<tr><td>被改写技能</td><td>${s.changed_skills} · 冲突 ${s.conflicts}</td></tr>`
      + `<tr><td>tokens</td><td>${s.prompt_tokens} + ${s.completion_tokens}`
      + (s.cost ? ` · 约 ${s.cost}` : '') + `</td></tr>`
      + `<tr><td>trigger 未知率</td><td>${(s.unknown_rate * 100).toFixed(1)}%</td></tr>`;
    out.appendChild(tb);
    if((s.changes || []).length){
      const line = el('div', 'llm-note');
      line.textContent = s.changes.slice(0, 6).map(c =>
        `${c.operator}/${c.skill}: ` + c.changes.map(x =>
          `${x.field} ${x.before}→${x.after}`).join(', ')).join('；');
      out.appendChild(line);
    }
    const hint = el('div', 'llm-note',
      '报告：data/reports/llm-review.md（建议人工过一遍「被改写」表）');
    out.appendChild(hint);
  }
}

/* ------------------------------------------------------------ 绑定 */

$('#go').onclick = runTeam;
$('#clr').onclick = () => { Object.keys(STATE).forEach(k => STATE[k] = 0); renderOps(); };
$('#q').oninput = renderOps;

(async function boot(){
  try{
    await waitForData();
    await loadMeta();
    await loadLLM();
  }catch(e){
    $('#result').textContent = e.message;
  }
})();
</script>
</body>
</html>

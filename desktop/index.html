<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>随心配</title>
<style>
/* 终末地官网风格：奶油纸底 / 墨黑 / 信号黄 / 全直角 / 工业编辑风 */
:root{
  --paper:#e8e8e2; --panel:#f2f2ec; --sunk:#dcddd6;
  --line:#d8d9d5; --line2:#b6b8b3;
  --ink:#101110; --ink2:#4a4c48; --ink3:#7a7d78;
  --accent:#fff500; --accent-deep:#e8e000; --accent-ink:#6b5d00;
  --err:#ff3b30; --ok:#2f9e44; --warn:#d9822b;
  --bar-battle:#101110; --bar-combo:#6b5d00; --bar-ult:#e8e000;
  --bar-power:#b6b8b3; --bar-normal:#4a4c48; --bar-enemy:#ff3b30;
  --wl-sp:#101110; --hit:#fff500;
  --grid:rgba(16,17,16,.035);
  --font:'Bahnschrift','Segoe UI','Microsoft YaHei UI',sans-serif;
  --mono:'Consolas','Cascadia Mono','Microsoft YaHei UI',monospace;
  --tb:40px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
     font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;
     overflow:hidden;letter-spacing:.005em}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/64px 64px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/64px 64px}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
/* ---------- 桌面标题栏 ---------- */
.tb{height:var(--tb);display:flex;align-items:center;gap:12px;padding:0 16px 0 18px;
    background:var(--paper);border-bottom:1px solid var(--ink);
    -webkit-app-region:drag;flex:0 0 auto}
.tb[hidden]{display:none}
.mark{width:12px;height:12px;background:var(--accent);border:1px solid var(--ink);
      display:inline-block;flex:0 0 auto}
.tb-brand{display:flex;align-items:baseline;gap:9px;font-family:var(--mono);
          letter-spacing:.2em;font-size:11px;text-transform:uppercase}
.tb-brand b{font-weight:700;color:var(--ink)}
.tb-brand .sub{color:var(--ink2);letter-spacing:.16em;font-size:10px}
.tb-meta{margin-left:auto;display:flex;gap:14px;align-items:center;font-family:var(--mono);
         font-size:10px;letter-spacing:.14em;color:var(--ink3);padding-right:140px}
.tb-meta .dot{width:6px;height:6px;background:var(--accent);border:1px solid var(--ink);
              display:inline-block}
/* ---------- 头部 ---------- */
header{position:relative;padding:7px 16px 8px;display:flex;gap:12px;align-items:center;
       background:var(--paper);border-bottom:2px solid var(--ink);flex:0 0 auto}
header::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:3px;
  background:repeating-linear-gradient(45deg,var(--ink) 0 5px,var(--accent) 5px 10px)}
header h1{font-size:16px;margin:0;font-weight:600;display:flex;align-items:center;gap:9px;
          letter-spacing:.02em}
header h1 .zh{font-size:16px}
header h1 .lat{color:var(--ink2);font-family:var(--mono);font-size:9px;
               letter-spacing:.26em;text-transform:uppercase;margin-top:2px}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink2);
      border:1px solid var(--line2);padding:1px 6px;text-transform:uppercase;background:var(--paper)}
#llm-btn{display:flex;gap:7px;align-items:center;padding:3px 10px;font-size:10px;
         font-weight:600;background:var(--paper);border:1px solid var(--ink);color:var(--ink);
         font-family:var(--mono);letter-spacing:.16em;cursor:pointer}
#llm-btn.on{background:var(--accent)}
#llm-btn .dot2{width:6px;height:6px;border:1px solid var(--ink);background:transparent}
#llm-btn.on .dot2{background:var(--ink)}
/* ---------- 布局 ---------- */
main{display:grid;grid-template-columns:300px 1fr;flex:1 1 auto;min-height:0}
#side{border-right:1px solid var(--ink);overflow:auto;padding:0 10px 12px;background:var(--paper)}
#main{overflow-y:auto;overflow-x:hidden;padding:14px 16px 22px}
/* ---------- 表单 ---------- */
input,select{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
  padding:5px 8px;font-size:12.5px;min-width:0;border-radius:0;font-family:var(--font)}
input:focus,select:focus{outline:none;border-color:var(--ink);
  box-shadow:0 0 0 2px var(--accent)}
input[type=text]{width:100%}
input[type=number]{-moz-appearance:textfield;text-align:center;padding:4px 2px;
  font-family:var(--mono)}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
button{background:var(--accent);color:var(--ink);border:1px solid var(--ink);
       padding:6px 12px;font-weight:600;cursor:pointer;font-size:12.5px;
       font-family:var(--font);border-radius:0;box-shadow:2px 2px 0 var(--ink)}
button:hover{background:var(--accent-deep);transform:translate(1px,1px);
             box-shadow:1px 1px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button.ghost{background:var(--paper);color:var(--ink);box-shadow:none}
button.ghost:hover{background:var(--sunk);transform:none;box-shadow:none}
button:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.row .muted{white-space:nowrap;flex:0 0 auto}
/* ---------- 区块标题 ---------- */
.sec{display:flex;align-items:center;gap:8px;padding:12px 2px 7px;
     border-bottom:1px solid var(--ink);margin-bottom:8px}
.sec .idx{font:700 10px var(--mono);background:var(--ink);color:var(--paper);
          padding:1px 5px;letter-spacing:.08em}
.sec .lat{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--ink2);
          text-transform:uppercase}
.sec .zh{font-size:11px;color:var(--ink2)}
.sec .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
/* ---------- 元素过滤 ---------- */
.elems{display:flex;gap:7px;margin:9px 0 4px;align-items:center}
.chip-btn{width:13px;height:13px;border:1px solid var(--ink);background:var(--panel);
          display:grid;place-items:center;cursor:pointer;padding:0;border-radius:0}
.chip-btn i{display:block;width:7px;height:7px;background:currentColor}
.chip-btn.on{background:var(--accent);box-shadow:0 0 0 1px var(--ink)}
/* ---------- 干员列表 ---------- */
#ops{margin-top:4px}
.op{display:flex;gap:9px;align-items:center;padding:3px 6px;cursor:pointer;
    border:0;border-left:2px solid transparent;position:relative;min-height:38px;
    background:transparent}
.op:hover{background:var(--panel);border-left-color:var(--ink)}
.op.must{background:var(--accent);border:1px solid var(--ink);border-left:2px solid var(--ink)}
.op.ban{background:var(--sunk);border-left-color:var(--err);opacity:.6}
.op .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.op .st{font-family:var(--mono);font-size:9.5px;color:var(--ink3);letter-spacing:.06em}
/* 头像：圆形（终末地只允许"本身就是圆"的元素保留圆形） */
.av{position:relative;display:inline-grid;place-items:center;overflow:hidden;
    border-radius:50%;background:var(--panel);box-shadow:0 0 0 1px var(--ink)}
.av i{font-style:normal;font-size:11px;color:var(--ink);font-weight:600}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.r6{box-shadow:0 0 0 1px var(--ink),0 0 0 3px var(--accent)}
.av.r5{box-shadow:0 0 0 1px var(--ink),0 0 0 3px var(--line2)}
.av.r4{box-shadow:0 0 0 1px var(--ink)}
/* ---------- 卡片 ---------- */
.card{position:relative;background:var(--panel);border:1px solid var(--line2);
      padding:11px 13px 12px;margin-bottom:13px;box-shadow:4px 4px 0 rgba(16,17,16,.10)}
.card::before,.card::after{content:"";position:absolute;width:11px;height:11px;
      border:1px solid var(--ink);pointer-events:none}
.card::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.card-h{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.card-h .lat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  background:var(--ink);color:var(--paper);padding:1px 6px}
.card-h .team{display:flex;gap:5px;align-items:center}
.card-h .tscore{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);
                letter-spacing:.14em}
.tabs{display:flex;gap:0;margin-left:6px}
.tabs button{padding:3px 9px;font-size:11px;background:var(--paper);color:var(--ink);
  border:1px solid var(--ink);box-shadow:none;font-family:var(--mono);letter-spacing:.1em}
.tabs button + button{border-left:0}
.tabs button.on{background:var(--accent)}
/* ---------- KPI ---------- */
.kpi{display:flex;gap:20px;align-items:baseline;margin:4px 0 10px;flex-wrap:wrap}
.kpi .k{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--ink2);
        text-transform:uppercase;margin-right:6px}
.kpi b{font-size:27px;font-weight:600;font-family:var(--mono);letter-spacing:-.01em}
.kpi .cold,.kpi .hot{display:flex;gap:6px;align-items:baseline;padding-right:22px;
  border-right:1px solid var(--line2)}
.kpi .dim2{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em}
/* ---------- 甘特 ---------- */
.lane{display:grid;grid-template-columns:108px minmax(0,1fr);gap:8px;align-items:center;
      margin:3px 0}
.lane .lb{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink2);
          white-space:nowrap;overflow:hidden}
.lane .lb span{overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:18px;background:var(--sunk);border:1px solid var(--line2)}
.track::after{z-index:0}
.track::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(16,17,16,.10) 0 1px, transparent 1px 10%)}
.bar{position:absolute;top:2px;height:12px;background:var(--bar-battle);z-index:1;
     border:1px solid rgba(16,17,16,.7)}
.bar.combo{background:var(--bar-combo)}
.bar.ultimate{background:var(--accent)}
.bar.power_attack{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,var(--sunk) 2px 5px)}
.bar.battle_skill{background:var(--bar-battle)}
.bar.normal_attack{background:var(--bar-normal)}
.bar.enemy{background:repeating-linear-gradient(45deg,var(--err) 0 3px,transparent 3px 6px);
           border-color:var(--err);opacity:.8}
.hit{position:absolute;top:0;width:1px;height:18px;background:var(--hit);opacity:.95;z-index:2}
.ticks{display:grid;grid-template-columns:108px minmax(0,1fr);gap:8px;color:var(--ink3);
       font-size:9px;font-family:var(--mono);letter-spacing:.06em}
.ticks .t{position:relative;height:13px;border-top:1px solid var(--line2)}
.ticks .t span{position:absolute;transform:translateX(-50%);top:2px}
.ticks .t span:first-child{transform:none}
/* ---------- 水位 ---------- */
.wl{position:relative;margin:9px 0 2px}
.wl-row{display:grid;grid-template-columns:108px minmax(0,1fr) 38px;gap:8px;
        align-items:center;margin:3px 0}
.wl-row .lb{display:flex;gap:5px;align-items:center;font-size:9.5px;color:var(--ink2);
            font-family:var(--mono);letter-spacing:.12em}
.wl-row .track{height:14px}
.wl-row .cap{font-family:var(--mono);font-size:9px;color:var(--ink3);text-align:right}
.wl svg{position:absolute;inset:0;width:100%;height:100%}
.wl-cursor{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);
           opacity:.6;display:none;pointer-events:none}
.wl-tip{position:absolute;top:-2px;transform:translate(-50%,-100%);background:var(--paper);
        border:1px solid var(--ink);padding:3px 8px;font-size:10px;font-family:var(--mono);
        white-space:nowrap;display:none;pointer-events:none;z-index:5;
        box-shadow:2px 2px 0 var(--ink)}
/* ---------- 贡献 ---------- */
.contrib{display:flex;height:5px;overflow:hidden;margin-top:9px;background:var(--sunk);
         border:1px solid var(--line2)}
.contrib div{height:100%}
/* ---------- 元信息 ---------- */
.meta-line{display:flex;gap:10px;align-items:center;margin-top:9px;font-size:10.5px;
           color:var(--ink3);font-family:var(--mono);letter-spacing:.04em}
.meta-line button{background:var(--paper);border:1px solid var(--line2);color:var(--ink2);
                  padding:1px 8px;font-size:10px;font-weight:400;box-shadow:none;
                  font-family:var(--mono)}
.meta-line button:hover{background:var(--sunk)}
details{margin-top:9px}
summary{cursor:pointer;color:var(--ink2);font-size:10px;list-style:none;
        font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
table{border-collapse:collapse;width:100%;font-size:10.5px;margin-top:7px}
th,td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
th{color:var(--ink2);font-weight:600;font-family:var(--mono);font-size:9px;
   letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink)}
td{font-family:var(--mono);font-size:10.5px}
.muted{color:var(--ink2);font-size:11px}
.wl-name{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:20px;border-top:1px solid var(--ink);padding-top:8px;display:flex;
  justify-content:space-between;font:9.5px var(--mono);letter-spacing:.16em;
  color:var(--ink3);text-transform:uppercase}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
.warn{color:var(--err);font-size:11.5px}
/* ---------- 首启 ---------- */
#boot{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;
      align-items:center;justify-content:center;padding:24px}
#boot.open{display:flex}
.boot-card{width:min(560px,100%);background:var(--panel);border:2px solid var(--ink);
           padding:26px;position:relative;box-shadow:8px 8px 0 var(--ink)}
.boot-card .lat{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--ink2);
                text-transform:uppercase;display:block;margin-bottom:10px}
.boot-card h2{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:.01em}
.bar-outer{height:10px;background:var(--sunk);border:1px solid var(--ink);
           overflow:hidden;margin:18px 0 8px}
.bar-inner{height:100%;width:0;background:var(--accent);
  transition:width .3s ease;
  box-shadow:inset -1px 0 0 var(--ink)}
.boot-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);
           font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.boot-err{color:var(--err);font-size:11px;white-space:pre-wrap;margin-top:10px;
          font-family:var(--mono)}
/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(16,17,16,.55);display:none;
       align-items:flex-start;justify-content:center;padding:24px;z-index:50;overflow:auto}
.modal.open{display:flex}
.modal-card{background:var(--panel);border:2px solid var(--ink);
  width:min(1180px,100%);padding:16px 18px;position:relative;box-shadow:8px 8px 0 var(--ink)}
.modal-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;
  background:repeating-linear-gradient(45deg,var(--ink) 0 5px,var(--accent) 5px 10px)}
.modal-card h2{font-size:14px;margin:6px 0 8px;font-family:var(--mono);letter-spacing:.2em;
  text-transform:uppercase}
.modal-card .close{position:absolute;right:10px;top:10px;background:transparent;border:0;
  color:var(--ink);font-size:20px;cursor:pointer;padding:0 8px;box-shadow:none}
.modal-card .close:hover{background:var(--accent);transform:none}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.cmp-side{border:1px solid var(--ink);padding:10px;background:var(--paper)}
.cmp-side h4{margin:0 0 8px;font-size:10px;color:var(--ink);font-family:var(--mono);
  letter-spacing:.22em;font-weight:700}
.cmp-side h4::before{content:"◼ ";color:var(--accent-ink)}
.cmp-side .field{display:grid;grid-template-columns:42px 1fr;gap:6px;
  align-items:center;margin-bottom:6px}
.cmp-side select{width:100%;padding:3px 6px;font-size:11.5px}
.cmp-out .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp-col{border:1px solid var(--line2);padding:10px;background:var(--panel)}
.cmp-sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:10px 0;
  padding:9px 12px;background:var(--paper);border:1px solid var(--ink);
  border-left:5px solid var(--accent);font-size:10.5px;font-family:var(--mono)}
.cmp-sum b{font-size:22px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--err)}
/* ---------- LLM 弹窗 ---------- */
.llm-grid{display:grid;grid-template-columns:92px 1fr;gap:9px;align-items:center;margin:11px 0}
.llm-grid input[type=text],.llm-grid input[type=password]{width:100%}
.llm-note{font-size:10.5px;color:var(--ink2);line-height:1.8;margin-top:9px}
.llm-run{border:1px solid var(--ink);padding:10px;margin-top:11px;background:var(--paper)}
.llm-run .row{margin-bottom:7px}
.pill{display:inline-block;font-size:9px;padding:1px 8px;border:1px solid var(--ink);
  color:var(--ink2);font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;
  background:var(--paper)}
.pill.ok{background:var(--accent);color:var(--ink)}
.pill.bad{background:var(--err);color:var(--paper);border-color:var(--err)}
.pill.run{background:var(--sunk)}
.llm-table{width:100%;font-size:10.5px;font-family:var(--mono)}
.llm-table td{padding:2px 5px;border-bottom:1px solid var(--line);color:var(--ink2)}

</style>
</head>
<body>

<div id="app">
<div id="titlebar" class="tb" hidden>
  <span class="slash"></span>
  <span class="tb-brand"><b>SUIXINPEI</b><span class="sub">// 随心配</span></span>
  <span class="tb-meta">
    <span id="tb-ver">v3.0.0</span>
    <span class="dot"></span>
    <span id="tb-data">DATA —</span>
  </span>
</div>

<header>
  <h1><span class="mark"></span><span class="zh">随心配</span><span class="lat">SUIXINPEI // SQUAD SIM</span></h1>
  <span class="chip" id="ver">…</span>
  <span class="chip" id="build-pill" hidden></span>
  <span style="flex:1"></span>
  <button id="llm-btn" title="LLM 自更新设置"><span class="dot2"></span>LLM</button>
</header>

<main>
  <aside id="side">
    <div class="sec"><span class="idx">01</span><span class="lat">OPERATORS</span><span class="zh">干员</span>
      <span class="cnt" id="op-count"></span></div>
    <div class="row"><input id="q" type="text" placeholder="搜索 / SEARCH" /></div>
    <div class="elems" id="elems"></div>
    <div class="row">
      <span class="muted">窗口</span>
      <input id="dur" type="number" value="40" style="width:38px" title="窗口（秒）"/>
      <select id="eprofile" title="敌人出手节奏" style="padding:4px 4px">
        <option value="normal">敌 8s</option>
        <option value="slow">敌 12s</option>
        <option value="fast">敌 5s</option>
        <option value="burst">敌 4s</option>
      </select>
      <span class="muted">Top</span>
      <input id="top" type="number" value="3" style="width:30px" title="Top N"/>
    </div>
    <div class="row">
      <button id="go" style="flex:1">推荐</button>
      <button id="clr" class="ghost" title="清空" style="padding:5px 9px">✕</button>
    </div>
    <div id="ops"></div>
  </aside>

  <section id="main">
    <div id="result">选人 → 推荐</div>
    <div class="foot" id="foot"></div>
  </section>
</main>
</div>

<div id="boot">
  <div class="boot-card">
    <span class="lat">INITIALIZING // SUIXINPEI</span>
    <h2 id="boot-title">准备数据…</h2>
    <div class="bar-outer"><div class="bar-inner" id="boot-bar"></div></div>
    <div class="boot-meta"><span id="boot-msg"></span><span id="boot-pct">0%</span></div>
    <div class="boot-err" id="boot-err" hidden></div>
    <div class="row" style="margin-top:10px">
      <button id="boot-retry" hidden>重试</button>
    </div>
  </div>
</div>

<div id="cmp" class="modal">
  <div class="modal-card">
    <button class="close" id="cmp-close">×</button>
    <h2>对比</h2>
    <div class="cmp-grid" id="cmp-config"></div>
    <div class="row"><button id="cmp-run">开始</button><span class="muted" id="cmp-status"></span></div>
    <div class="cmp-out" id="cmp-out"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const ELEM_COLOR = {物理:'#4a4c48',灼热:'#b3401f',电磁:'#8a6a00',寒冷:'#0f6f75',自然:'#4d7a16',超域:'#6d4fc4'};
const OP_COLORS = ['#6b5d00','#0f6f75','#4d7a16','#6d4fc4','#b3401f'];
const ENEMY_LABEL = {slow:'敌 12s', normal:'敌 8s', fast:'敌 5s', burst:'敌 4s'};
const RARITY_CLASS = {6:'r6',5:'r5',4:'r4'};
let META = null, STATE = {}, MODE = 'cold', LOADOUT = {}, ELEM = '';

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt; return e; }
function fmt(n){ return Math.round(n).toLocaleString(); }
function jget(url){ return fetch(url).then(async r => {
  const d = await r.json().catch(()=>({error:'bad json'}));
  if(!r.ok && d.error) throw new Error(d.error); return d; }); }
function jpost(url, body){ return fetch(url, {method:'POST',
  headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})})
  .then(async r => { const d = await r.json().catch(()=>({error:'bad json'}));
    if(!r.ok && d.error) throw new Error(d.error); return d; }); }

/* 头像：优先真实图，失败退化成"元素色块 + 首字" */
function avatar(opOrId, size, name){
  const op = (typeof opOrId === 'string')
    ? (META && META.operators.find(o => o.id === opOrId)) : opOrId;
  const id = op ? op.id : opOrId;
  const nm = name || (op && op.name) || '';
  const color = (op && ELEM_COLOR[op.element]) || '#39414f';
  const wrap = el('span', 'av ' + (RARITY_CLASS[(op||{}).rarity] || ''));
  wrap.style.width = wrap.style.height = size + 'px';
  wrap.style.background = 'radial-gradient(circle at 50% 35%, ' + color + '55, #161b22)';
  const i = el('i', null, nm.slice(0,1));
  i.style.fontSize = Math.max(10, Math.round(size*0.42)) + 'px';
  wrap.appendChild(i);
  if(id){
    const img = document.createElement('img');
    img.src = '/avatars/' + id + '.png';
    img.alt = nm;
    img.onerror = () => img.remove();
    wrap.appendChild(img);
  }
  wrap.title = nm + (op && op.profession ? ' · ' + op.profession : '')
    + (op && op.element ? ' · ' + op.element : '')
    + (op && op.note ? '\n' + op.note : '');
  return wrap;
}

/* ------------------------------------------------------------ 启动 */

async function waitForData(){
  const st = await jget('/api/status');
  if(st.state === 'ready'){ hideBoot(); return true; }
  showBoot(st);
  if(st.state === 'idle'){
    $('#boot-retry').hidden = false; $('#boot-retry').textContent = '开始';
  }
  return new Promise((resolve) => {
    const timer = setInterval(async () => {
      try{
        const s2 = await jget('/api/status'); updateBoot(s2);
        if(s2.state === 'ready'){ clearInterval(timer); hideBoot(); resolve(true); }
      }catch(e){}
    }, 700);
  });
}
function showBoot(st){ $('#boot').classList.add('open'); updateBoot(st); }
function hideBoot(){ $('#boot').classList.remove('open'); $('#build-pill').hidden = true; }
function updateBoot(st){
  const pct = Math.max(0, Math.min(100, st.percent || 0));
  $('#boot-bar').style.width = pct + '%';
  $('#boot-pct').textContent = pct + '%';
  $('#boot-msg').textContent = st.message || '';
  $('#boot-title').textContent = st.state === 'error' ? '构建失败' : '准备数据…';
  $('#boot-err').hidden = st.state !== 'error';
  $('#boot-retry').hidden = st.state !== 'error';
  if(st.state === 'error') $('#boot-err').textContent = st.error || '';
  $('#build-pill').hidden = false;
  $('#build-pill').textContent = st.state === 'error' ? '构建失败' : ('构建 ' + pct + '%');
}
$('#boot-retry').onclick = async () => {
  $('#boot-retry').disabled = true;
  try{ await jpost('/api/status', {action:'rebuild'}); }
  catch(e){ $('#boot-err').hidden = false; $('#boot-err').textContent = e.message; }
  finally{ $('#boot-retry').disabled = false; }
};

/* ------------------------------------------------------------ 选人 */

async function loadMeta(){
  META = await jget('/api/meta');
  $('#ver').textContent = 'v' + (META.app_version || '');
  $('#ver').title = '数据集 ' + (META.version || '') + ' · ' + META.count + ' 名可用干员';
  META.operators.forEach(o => { if(!(o.id in STATE)) STATE[o.id] = 0; });
  renderElems();
  renderOps();
}

function renderElems(){
  const box = $('#elems'); box.innerHTML = '';
  const all = el('button','chip-btn' + (ELEM===''?' on':''), '');
  all.title = '全部';
  all.innerHTML = '<i style="background:#5b6472"></i>';
  all.onclick = () => { ELEM = ''; renderElems(); renderOps(); };
  box.appendChild(all);
  Object.entries(ELEM_COLOR).forEach(([name, color]) => {
    const b = el('button','chip-btn' + (ELEM===name?' on':''));
    const d = el('i'); d.style.background = color; b.appendChild(d);
    b.title = name;
    b.onclick = () => { ELEM = (ELEM===name ? '' : name); renderElems(); renderOps(); };
    box.appendChild(b);
  });
}

function renderOps(){
  if(!META) return;
  const cnt = $('#op-count');
  if(cnt) cnt.textContent = META.count + ' / ' + META.operators.length;
  const q = ($('#q').value||'').trim().toLowerCase();
  const box = $('#ops'); box.innerHTML = '';
  META.operators
    .filter(o => (!q || o.name.toLowerCase().includes(q) ||
                  (o.tags||[]).some(t => t.toLowerCase().includes(q)))
              && (!ELEM || o.element === ELEM))
    .forEach(o => {
      const row = el('div','op' + (STATE[o.id]===1?' must':STATE[o.id]===2?' ban':''));
      row.appendChild(avatar(o, 30));
      row.appendChild(el('span','nm', o.name));
      row.onclick = () => { STATE[o.id] = (STATE[o.id]+1)%3; renderOps(); };
      row.title = `${o.name} · ${o.profession || ''} · ${o.element || ''}`
        + (o.note ? '\n' + o.note : '');
      box.appendChild(row);
    });
}

function picked(kind){ return Object.keys(STATE).filter(k => STATE[k]===kind); }

async function runTeam(){
  const btn = $('#go'); btn.disabled = true; btn.textContent = '…';
  try{
    const data = await jpost('/api/team', {must: picked(1), ban: picked(2),
      duration: +$('#dur').value, top: +$('#top').value, evaluate: 8});
    renderTeams(data);
  }catch(e){
    $('#result').innerHTML = ''; $('#result').appendChild(el('div','warn', e.message));
  }finally{ btn.disabled = false; btn.textContent = '推荐'; }
}

function renderTeams(data){
  const box = $('#result'); box.className = 'cards'; box.innerHTML = '';
  const foot = $('#foot');
  if(foot && META){
    foot.innerHTML = '<span>SUIXINPEI // ' + (META.count || 0) + ' OPERATORS</span>'
      + '<span>DATA ' + (META.version || '—') + ' · 30 FPS · 未建模项见 ⓘ</span>';
  }
  if(!data.top || !data.top.length){ box.appendChild(el('div','muted','无符合条件的队伍')); return; }
  data.top.forEach((t, i) => {
    const card = el('div','card');
    const h = el('div','card-h');
    h.appendChild(el('span','lat','SQ-' + String(i+1).padStart(2,'0')));
    const team = el('div','team');
    t.team.forEach(cid => {
      const op = META.operators.find(o => o.id === cid);
      team.appendChild(avatar(op || cid, 30, t.name_map[cid]));
    });
    h.appendChild(team);
    const mods = el('div','tabs');
    const btns = {};
    ['cold','hot'].forEach(m => {
      const b = el('button', (i===0?MODE:'cold')===m?'on':'', m==='cold'?'冷':'热');
      btns[m] = b;
      b.onclick = () => {
        ['cold','hot'].forEach(k => btns[k].className = (k===m?'on':''));
        loadAxis(t, m, card);
      };
      mods.appendChild(b);
    });
    h.appendChild(mods);
    const eq = el('button','ghost','装'); eq.title = '装备 / 武器推荐';
    eq.onclick = () => loadLoadout(t, card);
    const cp = el('button','ghost','比'); cp.title = '对比';
    cp.onclick = () => openCompare(t);
    h.appendChild(eq); h.appendChild(cp);
    card.appendChild(h);
    const kpi = el('div','kpi');
    kpi.appendChild(kpiEl('cold','冷', t.cold.result.dps));
    kpi.appendChild(kpiEl('hot','热', t.hot.result.dps));
    const tot = el('div','dim2','总伤 ' + fmt(t.cold.result.total_damage));
    kpi.appendChild(tot);
    card.appendChild(kpi);
    const holder = el('div'); holder.id = 'axis-'+i; card.appendChild(holder);
    box.appendChild(card);
    if(i === 0) loadAxis(t, MODE, card);
  });
}

function kpiEl(cls, label, dps){
  const d = el('div', cls);
  d.appendChild(el('span','k', label));
  d.appendChild(el('b', null, fmt(dps)));
  return d;
}

async function loadAxis(t, mode, card){
  const holder = card.querySelector('[id^=axis-]');
  if(!holder) return;
  holder.innerHTML = '';
  holder.appendChild(el('div','muted','…'));
  const q = new URLSearchParams({team:t.team.join(','), mode,
    duration:$('#dur').value, enemy: $('#eprofile').value || 'normal'});
  try{
    const data = await jget('/api/axis?' + q.toString());
    holder.innerHTML = '';
    holder.appendChild(renderAxis(data.rotation.result, t, data.config));
  }catch(e){
    holder.innerHTML = '';
    holder.appendChild(el('div','warn', e.message));
  }
}

/* ------------------------------------------------------------ 甘特 + 水位 */

function gantt(res, order, nameMap){
  const dur = Math.max(1, res.duration_frames)/30;
  const box = el('div');
  const lane = (labelNode, events) => {
    const l = el('div','lane');
    const lb = el('div','lb');
    if(labelNode) lb.appendChild(labelNode);
    l.appendChild(lb);
    const tr = el('div','track');
    events.forEach(ev => {
      const s = ev.frame/30, e = Math.max(ev.commit_end||ev.frame, ev.frame+1)/30;
      const b = el('div','bar ' + (ev.bar||''));
      b.style.left = (s/dur*100)+'%';
      b.style.width = Math.max(0.5,(e-s)/dur*100)+'%';
      b.title = `${ev.label} ${s.toFixed(2)}s`;
      tr.appendChild(b);
      (ev.hits||[]).forEach(hf => {
        const hit = el('div','hit'); hit.style.left = ((hf/30)/dur*100)+'%';
        tr.appendChild(hit);
      });
    });
    l.appendChild(tr);
    return l;
  };
  order.forEach(cid => {
    const op = META.operators.find(o => o.id === cid);
    const lb = document.createElement('span');
    lb.appendChild(avatar(op || cid, 18, nameMap[cid]));
    lb.appendChild(document.createTextNode(nameMap[cid] || cid));
    const evs = (res.timeline||[]).filter(e => e.kind==='cast' && e.op===cid)
      .map(e => ({...e, bar: e.slot}));
    box.appendChild(lane(lb, evs));
  });
  const enemy = (res.timeline||[]).filter(e => e.kind==='enemy_attack')
    .map(e => ({frame:e.frame, commit_end:e.frame, label:e.label, bar:'enemy'}));
  if(enemy.length) box.appendChild(lane(el('span',null,''), enemy));

  const ticks = el('div','ticks');
  ticks.appendChild(el('div'));
  const tk = el('div','t');
  const step = dur > 60 ? 10 : 5;
  for(let s=0;s<=dur;s+=step){
    const sp = el('span',null,s+'s');
    sp.style.left = (s/dur*100)+'%';
    tk.appendChild(sp);
  }
  ticks.appendChild(tk);
  return {box, ticks};
}

function waterlines(res, order, nameMap){
  const st = res.stats || {};
  const samples = (st.samples || []).slice().sort((a,b)=>a.f-b.f);
  const durF = Math.max(1, res.duration_frames);
  const spMax = st.sp_max || 300;
  const caps = st.energy_cap || {};
  const wrap = el('div','wl');
  const rows = [];

  const row = (labelNode, color, max, getter, energyId) => {
    const r = el('div','wl-row');
    const lb = el('div','lb');
    if(labelNode) lb.appendChild(labelNode);
    r.appendChild(lb);
    const tr = el('div','track');
    r.appendChild(tr);
    r.appendChild(el('span','cap', String(Math.round(max))));
    if(samples.length){
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS,'svg');
      svg.setAttribute('viewBox','0 0 1000 40');
      svg.setAttribute('preserveAspectRatio','none');
      const pts = samples.map(s => {
        const x = (s.f/durF)*1000;
        const v = Math.max(0, Math.min(max, getter(s)));
        const y = 38 - (v/(max||1))*34;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      if(energyId === null){
        const area = document.createElementNS(NS,'polygon');
        area.setAttribute('points', `0,40 ${pts} 1000,40`);
        area.setAttribute('fill', color); area.setAttribute('opacity','0.10');
        svg.appendChild(area);
      }
      const line = document.createElementNS(NS,'polyline');
      line.setAttribute('points', pts);
      line.setAttribute('fill','none');
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width','2');
      line.setAttribute('vector-effect','non-scaling-stroke');
      line.setAttribute('stroke-linejoin','round');
      svg.appendChild(line);
      tr.appendChild(svg);
    }
    rows.push({labelNode, max, getter, energyId, color});
    return r;
  };

  const spLabel = el('span', 'wl-name', 'SP / 技力');
  wrap.appendChild(row(spLabel, '#101110', spMax, s=>s.sp, null));
  order.forEach((cid, i) => {
    const op = META.operators.find(o => o.id === cid);
    wrap.appendChild(row(avatar(op || cid, 16, nameMap[cid]),
      OP_COLORS[i % OP_COLORS.length], caps[cid] || 100,
      s=>((s.e||{})[cid]||0), cid));
    const lastRow = wrap.lastElementChild;
    if(lastRow){
      const nm = el('span','wl-name', nameMap[cid] || '');
      lastRow.querySelector('.lb').appendChild(nm);
    }
  });

  if(samples.length){
    const cur = el('div','wl-cursor'), tip = el('div','wl-tip');
    wrap.appendChild(cur); wrap.appendChild(tip);
    wrap.onmousemove = (ev) => {
      const trackEl = wrap.querySelector('.track');
      if(!trackEl) return;
      const r = trackEl.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (ev.clientX - r.left)/Math.max(1,r.width)));
      const f = ratio * durF;
      let lo = 0, hi = samples.length - 1;
      while(lo < hi){ const mid = (lo+hi)>>1; if(samples[mid].f < f) lo = mid+1; else hi = mid; }
      if(lo > 0 && Math.abs(samples[lo-1].f - f) < Math.abs(samples[lo].f - f)) lo -= 1;
      const s = samples[lo];
      const x = r.left - wrap.getBoundingClientRect().left + ratio*r.width;
      cur.style.display = 'block'; tip.style.display = 'block';
      cur.style.left = x + 'px'; tip.style.left = x + 'px';
      const parts = [`<b>${(s.f/30).toFixed(1)}s</b>`, `SP ${Math.round(s.sp)}`];
      rows.filter(x2=>x2.energyId).forEach(x2 => {
        const nm = (nameMap[x2.energyId] || x2.energyId);
        parts.push(`${nm} ${Math.round(x2.getter(s))}/${Math.round(x2.max)}`);
      });
      tip.innerHTML = parts.join(' · ');
    };
    wrap.onmouseleave = () => { cur.style.display='none'; tip.style.display='none'; };
  }
  return wrap;
}

function renderAxis(res, t, cfg){
  const wrap = el('div');
  const order = t.team, nameMap = t.name_map || {};
  const g = gantt(res, order, nameMap);
  wrap.appendChild(g.box);
  wrap.appendChild(g.ticks);
  wrap.appendChild(waterlines(res, order, nameMap));

  // 贡献条（颜色 = 角色，宽度 = 占比；不写字）
  const bar = el('div','contrib');
  const total = Math.max(1, res.total_damage);
  Object.entries(res.per_operator || {}).sort((a,b)=>b[1]-a[1]).forEach(([cid, d]) => {
    const idx = order.indexOf(cid);
    const seg = el('div');
    seg.style.width = (d/total*100) + '%';
    seg.style.background = OP_COLORS[(idx<0?0:idx) % OP_COLORS.length];
    seg.title = `${nameMap[cid] || cid} ${(d/total*100).toFixed(0)}%`;
    bar.appendChild(seg);
  });
  wrap.appendChild(bar);

  const meta = el('div','meta-line');
  const det = el('details');
  const sum = el('summary', null, 'ⓘ');
  sum.title = '细节：动作表 / 警告 / 未建模项';
  det.appendChild(sum);
  if(res.legality_issues && res.legality_issues.length){
    det.appendChild(el('div','warn', res.legality_issues.slice(0,3).join('; ')));
  }
  const fields = (res.stats && res.stats.cast_counts) || {};
  const slots = ['normal_attack','power_attack','battle_skill','combo_skill','ultimate'];
  det.appendChild(el('div','muted', '施放 ' + slots.reduce((a,k)=>a+(fields[k]||0),0)
    + ' 次 · 自动普攻 ' + (fields.auto_attack||0) + ' 次'));
  const rx = (res.stats && res.stats.reactions) || {};
  if(rx.totals && Object.keys(rx.totals).length){
    det.appendChild(el('div','muted', '异常 ' + Object.entries(rx.totals)
      .sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+fmt(v)).join(' · ')));
  }
  const tb = el('table');
  tb.innerHTML = '<tr><th>时间</th><th>结束</th><th>动作</th><th>命中</th></tr>';
  (res.timeline||[]).filter(e=>e.kind==='cast')
    .sort((a,b)=>a.frame-b.frame).forEach(e => {
      const tr = el('tr');
      tr.innerHTML = `<td>${(e.frame/30).toFixed(2)}</td>`+
        `<td>${((e.commit_end||e.frame)/30).toFixed(2)}</td>`+
        `<td>${e.label||e.kind}</td>`+
        `<td>${(e.hits||[]).map(h=>(h/30).toFixed(2)).join(', ')}</td>`;
      tb.appendChild(tr);
    });
  det.appendChild(tb);
  if(res.warnings && res.warnings.length){
    det.appendChild(el('div','muted', res.warnings.join('；')));
  }
  if(res.unmodeled && res.unmodeled.length){
    det.appendChild(el('div','muted', '未建模：' + res.unmodeled.join('；')));
  }
  meta.appendChild(det);
  wrap.appendChild(meta);
  return wrap;
}

/* ------------------------------------------------------------ 装备/武器 */

async function ensureLoadout(team){
  const key = team.join(',');
  if(LOADOUT[key]) return LOADOUT[key];
  const data = await jpost('/api/loadout', {team});
  LOADOUT[key] = data.recommendations || {};
  return LOADOUT[key];
}

async function loadLoadout(t, card){
  let box = card.querySelector('.loadout-box');
  if(!box){ box = el('div','loadout-box'); card.appendChild(box); }
  box.innerHTML = ''; box.appendChild(el('div','muted','…'));
  try{
    const rec = await ensureLoadout(t.team);
    box.innerHTML = '';
    for(const row of Object.values(rec)){
      const blk = el('div'); blk.style.margin = '6px 0';
      const head = el('div','row');
      const op = META.operators.find(o => o.name === row.name);
      head.appendChild(avatar(op || row.name, 22, row.name));
      head.appendChild(el('span','muted', row.name));
      blk.appendChild(head);
      const tb = el('table');
      tb.innerHTML = '<tr><th>武器</th><th>ATK</th><th>ATK%</th><th>主属</th><th>等效</th></tr>';
      (row.weapons||[]).forEach(w => {
        const tr = el('tr');
        tr.innerHTML = `<td>${w.name || w.weapon_id}</td><td>${w.atk}</td>`+
          `<td>${(w.atk_pct*100).toFixed(0)}%</td><td>+${w.mainattr}</td><td>${fmt(w.score)}</td>`;
        tb.appendChild(tr);
      });
      blk.appendChild(tb);
      (row.equipment||[]).forEach(s => {
        const pieces = (s.piece_names && s.piece_names.length) ? s.piece_names : s.pieces;
        const line = el('div','muted', s.label + '：' + pieces.join('、'));
        line.title = (s.pieces||[]).join('\n');
        blk.appendChild(line);
      });
      box.appendChild(blk);
    }
  }catch(e){
    box.innerHTML = ''; box.appendChild(el('div','warn', e.message));
  }
}

/* ------------------------------------------------------------ 对比 */

let CMP_TEAM = null;

function sideConfig(side){
  const wrap = el('div','cmp-side');
  wrap.appendChild(el('h4', null, side.toUpperCase()));
  const field = (label, node) => {
    const f = el('div','field');
    f.appendChild(el('span','muted', label));
    f.appendChild(node);
    wrap.appendChild(f);
    return node;
  };
  const mk = (pairs) => {
    const s = document.createElement('select');
    pairs.forEach(([v,l]) => { const o = document.createElement('option');
      o.value = v; o.textContent = l; s.appendChild(o); });
    return s;
  };
  const mode = field('启动', mk([['cold','冷'],['hot','热']]));
  const enemy = field('敌人', mk(Object.entries(ENEMY_LABEL)));
  const equip = field('装备', mk((META.equip_presets||[]).map(p=>[p.id,p.label])));
  const lv = field('精锻', mk([[0,'0'],[1,'1'],[2,'2'],[3,'3']]));
  lv.value = '3';
  const rec = LOADOUT[(CMP_TEAM||[]).join(',')] || {};
  const first = Object.values(rec)[0] || {};
  const wopts = [['0','默认']].concat((first.weapons||[]).map((w,i)=>
    [String(i+1), '推荐' + (i+1) + ' ' + (w.name || w.weapon_id)]));
  const weapon = field('武器', mk(wopts));
  wrap._ctrl = {mode, enemy, equip, equip_level: lv, weapon};
  return wrap;
}

async function openCompare(t){
  CMP_TEAM = t.team;
  const box = $('#cmp-config'); box.innerHTML = '';
  try{ await ensureLoadout(t.team); }catch(e){}
  const a = sideConfig('a'), b = sideConfig('b');
  a._ctrl.mode.value = 'cold'; a._ctrl.enemy.value = 'normal';
  b._ctrl.mode.value = 'cold'; b._ctrl.enemy.value = 'normal';
  b._ctrl.equip.value = 'output';
  box.appendChild(a); box.appendChild(b);
  $('#cmp-out').innerHTML = '';
  $('#cmp-status').textContent = '';
  $('#cmp').classList.add('open');
  $('#cmp')._sides = [a, b];
  $('#cmp')._team = t;
  $('#cmp-run').onclick = () => runCompare(t);
}
function sideSpec(sideEl){
  const c = sideEl._ctrl;
  return {mode:c.mode.value, enemy:c.enemy.value, equip:c.equip.value,
          equip_level:+c.equip_level.value, weapon:+c.weapon.value};
}
async function runCompare(t){
  const sides = $('#cmp')._sides || [];
  $('#cmp-run').disabled = true; $('#cmp-status').textContent = '…';
  try{
    const data = await jpost('/api/compare', {team:t.team, duration:+$('#dur').value,
      a:sideSpec(sides[0]), b:sideSpec(sides[1])});
    renderCompare(data, t);
    $('#cmp-status').textContent = '';
  }catch(e){ $('#cmp-status').textContent = e.message; }
  finally{ $('#cmp-run').disabled = false; }
}
function renderCompare(data, t){
  const out = $('#cmp-out'); out.innerHTML = '';
  const A = data.sides.a, B = data.sides.b, d = data.delta || {};
  const sum = el('div','cmp-sum');
  const cls = (d.total_damage >= 0) ? 'up' : 'down';
  const big = el('div', cls);
  big.appendChild(el('b', null, (d.total_damage>=0?'+':'') + fmt(d.total_damage)));
  sum.appendChild(big);
  sum.appendChild(el('span', cls, (d.damage_pct>=0?'+':'') + (d.damage_pct||0).toFixed(1) + '%'));
  sum.appendChild(el('span','muted', fmt(A.rotation.result.total_damage) + ' → '
    + fmt(B.rotation.result.total_damage)));
  out.appendChild(sum);

  const cols = el('div','cols');
  [A, B].forEach(side => {
    const col = el('div','cmp-col');
    const h = el('div','row');
    const team = el('div','team');
    t.team.forEach(cid => {
      const op = META.operators.find(o => o.id === cid);
      team.appendChild(avatar(op || cid, 22, (data.name_map||{})[cid]));
    });
    h.appendChild(team);
    h.appendChild(el('span','muted', side.side + ' '
      + (side.config.mode === 'hot' ? '热' : '冷')));
    col.appendChild(h);
    const res = side.rotation.result;
    const kpi = el('div','kpi');
    kpi.appendChild(kpiEl(side.config.mode === 'hot' ? 'hot' : 'cold', 'DPS', res.dps));
    col.appendChild(kpi);
    const g = gantt(res, t.team, data.name_map || t.name_map);
    col.appendChild(g.box); col.appendChild(g.ticks);
    col.appendChild(waterlines(res, t.team, data.name_map || t.name_map));
    cols.appendChild(col);
  });
  out.appendChild(cols);
}

$('#cmp-close').onclick = () => $('#cmp').classList.remove('open');
$('#cmp').onclick = (e) => { if(e.target.id === 'cmp') $('#cmp').classList.remove('open'); };

/* ------------------------------------------------------------ LLM 自更新 */

let LLM = null, LLM_POLL = null, LLM_OPEN = false;

function llmChip(){
  const b = $('#llm-btn');
  if(!b) return;
  const on = !!(LLM && LLM.available);
  b.classList.toggle('on', on);
  b.title = on
    ? `LLM 已启用 · ${LLM.model} · prompt ${LLM.prompt_version}`
    : 'LLM 未配置（规则模式）';
}

async function loadLLM(){
  try{ LLM = await jget('/api/llm'); }catch(e){ /* 旧后端没有该接口 */ }
  llmChip();
  if(LLM_OPEN) fillLLM();
}

function fillLLM(){
  if(!LLM) return;
  $('#llm-state').textContent =
    (LLM.available ? `已启用 · ${LLM.model}` : '未配置（规则模式）')
    + ` · prompt ${LLM.prompt_version} · 缓存 ${LLM.cache_files} 条`;
  $('#llm-enabled').checked = !!LLM.enabled;
  $('#llm-base').value = LLM.base || '';
  $('#llm-model').value = LLM.model || '';
  $('#llm-key').value = '';
  $('#llm-key').placeholder = LLM.has_key
    ? `已保存（${LLM.key_masked}），留空不修改` : '粘贴 API key';
  $('#llm-path').textContent = LLM.config_path || 'data/llm.json';
  renderLLMRun(LLM.run || {});
}

$('#llm-btn').onclick = async () => {
  LLM_OPEN = true;
  $('#llm').classList.add('open');
  await loadLLM();
  fillLLM();
};
$('#llm-close').onclick = () => { LLM_OPEN = false; $('#llm').classList.remove('open'); };
$('#llm').onclick = (e) => {
  if(e.target.id === 'llm'){ LLM_OPEN = false; $('#llm').classList.remove('open'); }
};

$('#llm-save').onclick = async () => {
  const patch = {
    enabled: $('#llm-enabled').checked,
    base: $('#llm-base').value.trim(),
    model: $('#llm-model').value.trim(),
  };
  const key = $('#llm-key').value.trim();
  if(key) patch.key = key;
  try{
    LLM = await jpost('/api/llm', patch);
    $('#llm-msg').textContent = '已保存';
    fillLLM(); llmChip();
  }catch(e){ $('#llm-msg').textContent = e.message; }
};

$('#llm-test').onclick = async () => {
  $('#llm-msg').textContent = '测试中…';
  try{
    const r = await jpost('/api/llm/test');
    $('#llm-msg').textContent = r.ok
      ? `连接成功 · ${r.model} · ${r.latency_ms}ms`
      : `失败：${r.error}`;
  }catch(e){ $('#llm-msg').textContent = e.message; }
};

$('#llm-run-btn').onclick = async () => {
  const mode = $('#llm-mode').value;
  const limit = $('#llm-limit').value;
  try{
    await jpost('/api/llm/run', {mode, limit: limit ? +limit : undefined});
    $('#llm-run-pill').className = 'pill run';
    $('#llm-run-pill').textContent = '运行中';
    startLLMPoll();
  }catch(e){
    $('#llm-run-pill').className = 'pill bad';
    $('#llm-run-pill').textContent = '失败';
    $('#llm-run-msg').textContent = e.message;
  }
};

function startLLMPoll(){
  if(LLM_POLL) return;
  LLM_POLL = setInterval(async () => {
    try{
      LLM = await jget('/api/llm');
      llmChip();
      renderLLMRun(LLM.run || {});
      if(LLM.run && LLM.run.state !== 'running'){
        clearInterval(LLM_POLL); LLM_POLL = null;
        if(LLM.run.state === 'done') await loadMeta();
      }
    }catch(e){}
  }, 900);
}

function renderLLMRun(run){
  const pill = $('#llm-run-pill'), msg = $('#llm-run-msg'), out = $('#llm-run-out');
  if(run.state === 'running'){
    pill.className = 'pill run'; pill.textContent = '运行中';
    msg.textContent = run.message || '';
  }else if(run.state === 'done'){
    pill.className = 'pill ok'; pill.textContent = '完成'; msg.textContent = '';
  }else if(run.state === 'error'){
    pill.className = 'pill bad'; pill.textContent = '失败';
    msg.textContent = run.error || '';
  }else{
    pill.className = 'pill'; pill.textContent = '空闲'; msg.textContent = '';
  }
  if(run.state === 'done' && run.stats){
    const s = run.stats;
    out.innerHTML = '';
    const tb = el('table', 'llm-table');
    tb.innerHTML =
      `<tr><td>采纳 / 拒绝</td><td>${s.llm_used} / ${s.llm_rejected}`
      + `（缓存 ${s.llm_cache}，修复 ${s.repaired}）</td></tr>`
      + `<tr><td>被改写技能</td><td>${s.changed_skills} · 冲突 ${s.conflicts}</td></tr>`
      + `<tr><td>tokens</td><td>${s.prompt_tokens} + ${s.completion_tokens}`
      + (s.cost ? ` · 约 ${s.cost}` : '') + `</td></tr>`
      + `<tr><td>trigger 未知率</td><td>${(s.unknown_rate * 100).toFixed(1)}%</td></tr>`;
    out.appendChild(tb);
    if((s.changes || []).length){
      const line = el('div', 'llm-note');
      line.textContent = s.changes.slice(0, 6).map(c =>
        `${c.operator}/${c.skill}: ` + c.changes.map(x =>
          `${x.field} ${x.before}→${x.after}`).join(', ')).join('；');
      out.appendChild(line);
    }
    const hint = el('div', 'llm-note',
      '报告：data/reports/llm-review.md（建议人工过一遍「被改写」表）');
    out.appendChild(hint);
  }
}

/* ------------------------------------------------------------ 绑定 */

$('#go').onclick = runTeam;
$('#clr').onclick = () => { Object.keys(STATE).forEach(k => STATE[k] = 0); renderOps(); };
$('#q').oninput = renderOps;

function initShell(){
  const shell = location.search.includes('shell=1');
  if(!shell) return;
  document.body.classList.add('shell');
  const tb = $('#titlebar');
  if(tb) tb.hidden = false;
}

(async function boot(){
  initShell();
  try{
    await waitForData();
    await loadMeta();
    await loadLLM();
    const tbVer = $('#tb-ver'), tbData = $('#tb-data');
    if(tbVer && META) tbVer.textContent = 'v' + (META.app_version || '');
    if(tbData && META) tbData.textContent = 'DATA ' + (META.version || '—');
  }catch(e){
    $('#result').textContent = e.message;
  }
})();
</script>
